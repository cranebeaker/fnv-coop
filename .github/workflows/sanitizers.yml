# Linux-only checks that need no game: synccore and the simfuzz soak under ASan + UBSan (g++ and clang).
# ci.yml has the plain builds and the Python quick suite; nothing here touches game files or secrets.
name: sanitizers

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"      # weekly: a fresh block of seeds (see "Seed base")
  workflow_dispatch:
    inputs:
      seed_base:
        description: "first simfuzz seed (default: 1 on PRs and pushes, a date-based block on the weekly run)"
        required: false
      count:
        description: "sessions per simfuzz sweep (default 300)"
        required: false

permissions:
  contents: read

env:
  # -fno-sanitize-recover makes the first UBSan finding fail the process instead of printing and carrying on.
  SAN_FLAGS: -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -O1 -g
  ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:abort_on_error=0
  LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/lsan.supp:print_suppressions=1
  UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

jobs:
  synccore-san:
    name: synccore tests, ASan+UBSan (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cxx: g++, cc: gcc }
          - { cxx: clang++, cc: clang }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5   # the drift_effect_table test calls python
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libenet-dev clang
      - name: Twin of the sanitizers themselves
        # A planted heap overflow, signed overflow and leak must each be REPORTED (the report text, not only a non-zero exit) with
        # these exact flags and with the suppressions in .github/lsan.supp loaded (so a suppression that is too wide shows up here
        # too). Each program exits 0 when nothing stops it, and the overflow goes through a volatile so the optimizer cannot fold it
        # away (g++ 16 at -O1 removed the old `(x + 1) > 0` check entirely).
        run: |
          set -u
          printf 'int main(int c, char**) { int* p = new int[2]; p[c + 1] = 1; int r = p[0] * 0; delete[] p; return r; }\n' > twin_asan.cpp
          printf '#include <climits>\nint main(int c, char**) { volatile int x = INT_MAX; int y = x + c; return y == 0; }\n' > twin_ubsan.cpp
          printf '#include <cstdio>\nint main() { int* p = new int[4]; std::printf("%%p\\n", (void*)p); p = nullptr; return 0; }\n' > twin_lsan.cpp
          for spec in "twin_asan:ERROR: AddressSanitizer|: runtime error: " "twin_ubsan:: runtime error: " "twin_lsan:ERROR: LeakSanitizer"; do
            t=${spec%%:*}; want=${spec#*:}
            ${{ matrix.cxx }} $SAN_FLAGS $t.cpp -o $t
            if ./$t > $t.out 2>&1; then cat $t.out; echo "::error::$t exited 0: the sanitizer did not stop the planted bug"; exit 1; fi
            grep -aqE "$want" $t.out || { cat $t.out; echo "::error::$t failed without the sanitizer report ($want)"; exit 1; }
          done
      - name: Configure
        run: >
          cmake -S synccore -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          "-DCMAKE_C_FLAGS=$SAN_FLAGS" "-DCMAKE_CXX_FLAGS=$SAN_FLAGS" "-DCMAKE_EXE_LINKER_FLAGS=$SAN_FLAGS"
      - run: cmake --build build --parallel
      # Excluded, with the reason: unit_perf / twin_perf_regression_still_fails / flight_perf have wall-clock budgets, meaningless at
      # sanitizer speed (flight_perf failed under load). twin_unit_async_completion_leak puts the #46 reference cycle back on purpose,
      # so LSan rightly fails it: the next step runs it on its own.
      # .github/lsan.supp has no entries: everything must be clean. A report inside a WILL_FAIL test only makes that test exit non-zero,
      # which WILL_FAIL counts as the expected failure, so the output of EVERY test (ctest -V) is also searched for a report. Not
      # log_path: g++'s UBSan at -O1 ignores it and writes to stderr.
      - name: ctest (and no sanitizer report from any test, WILL_FAIL ones included)
        run: |
          # -a on every grep of ctest-all.log: some test output holds NUL bytes, and grep would then only say "binary file matches"
          # instead of showing the lines (tools/lint/check_workflow_inputs.py checks it).
          reports() { grep -aE "ERROR: (AddressSanitizer|LeakSanitizer)|: runtime error: " "$1"; }
          # Twin: the planted overflow and signed overflow (built in the twin step above) must be found by the same search.
          for t in twin_asan twin_ubsan; do
            ./$t > $t.out 2>&1 || true
            reports $t.out > /dev/null || { cat $t.out; echo "::error::the report search does not find the planted bug in $t"; exit 1; }
          done
          rc=0
          ctest --test-dir build -V -j 4 --timeout 900 -E '^(unit_perf|twin_perf_regression_still_fails|flight_perf|twin_unit_async_completion_leak)$' > ctest-all.log 2>&1 || rc=$?
          grep -aE "^[0-9]+/[0-9]+ Test|tests passed|tests failed|\(Failed\)|\(Timeout\)" ctest-all.log | tail -40
          if reports ctest-all.log > san-hits.txt; then
            head -40 san-hits.txt
            echo "::error::$(wc -l < san-hits.txt) sanitizer report line(s) in the output of ctest (see ctest-all.log)"; exit 1
          fi
          [ "$rc" -eq 0 ] || { grep -a -B2 -A40 -E "\*\*\*(Failed|Timeout)|Subprocess aborted" ctest-all.log | tail -200; }
          exit $rc

      - name: LSan catches the runAsync cycle of issue #46 (its twin)
        # The twin restores the cyclic capture. With leak checking on it must fail on LSan's report; with it off its own CHECK must pass.
        # Together: the fix holds (the main run has no leak and no suppression for it) and LSan would see the bug come back.
        run: |
          set -u
          if ASAN_OPTIONS=detect_leaks=1 ./build/fnvcoop_tests --group twin --name unit_async_completion_leak > leak_twin.log 2>&1; then
            cat leak_twin.log; echo "::error::the #46 twin exited 0 with LSan on: the reference cycle was not reported"; exit 1
          fi
          grep -q "LeakSanitizer: detected memory leaks" leak_twin.log || { cat leak_twin.log; echo "::error::the #46 twin failed, but not on a leak"; exit 1; }
          ASAN_OPTIONS=detect_leaks=0 ./build/fnvcoop_tests --group twin --name unit_async_completion_leak

  simfuzz-soak:
    name: simfuzz soak, ASan+UBSan (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cxx: g++, cc: gcc }
          - { cxx: clang++, cc: clang }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Seed base
        # PRs and pushes use the same seeds every time (a red run can be reproduced exactly). The weekly run moves to a new block
        # each week; the seed it used is printed, and `fnvcoop_simfuzz --target em --seed N --count 1` replays one session.
        # The manual inputs arrive as environment variables (never pasted into the script) and must be positive integers: a count
        # of 0 or text would run no session and still pass. fnvcoop_simfuzz reads --count with atoi (an int) and the mini sweep runs
        # COUNT * 10, so count has at most 8 digits; the seed is read as 64 bits and may have 10.
        env:
          IN_SEED_BASE: ${{ github.event.inputs.seed_base }}
          IN_COUNT: ${{ github.event.inputs.count }}
          EVENT: ${{ github.event_name }}
        run: |
          set -u
          positive() { [[ "$3" =~ ^[1-9][0-9]{0,$(( $2 - 1 ))}$ ]] || { echo "::error::$1 must be a positive integer of at most $2 digits, got '$3'"; exit 1; }; }
          if [ -n "$IN_SEED_BASE" ]; then positive seed_base 10 "$IN_SEED_BASE"; base="$IN_SEED_BASE"
          elif [ "$EVENT" = schedule ]; then base=$(( $(date +%s) / 604800 * 100000 + 1 ))
          else base=1; fi
          count="${IN_COUNT:-300}"; positive count 8 "$count"
          echo "SEED_BASE=$base (count $count)"
          echo "SEED_BASE=$base" >> "$GITHUB_ENV"
          echo "COUNT=$count" >> "$GITHUB_ENV"
      - name: Configure (fuzzer, em and mini targets)
        run: >
          cmake -S synccore/fuzz -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          "-DCMAKE_CXX_FLAGS=$SAN_FLAGS" "-DCMAKE_EXE_LINKER_FLAGS=$SAN_FLAGS"
      - run: cmake --build build --parallel
      - name: Fuzzer unit tests (include the mutation twins and saved repros)
        run: ./build/fnvcoop_fuzz_tests --group fuzz
      - name: Twin of the soak
        # With a fault injected the sweep must fail; a soak that cannot fail proves nothing.
        run: |
          if ./build/fnvcoop_simfuzz --target em --bug no_dedupe --seed 1 --count 30 --no-shrink --quiet --out out/twin; then
            echo "::error::the soak passed with the no_dedupe fault injected"; exit 1
          fi
      - name: Soak (em, plain link)
        run: ./build/fnvcoop_simfuzz --target em --seed "$SEED_BASE" --count "$COUNT" --duration 8000 --out out/em-plain
      - name: Soak (em, bad_wifi)
        if: ${{ !cancelled() }}   # a failing sweep must not hide the others
        run: ./build/fnvcoop_simfuzz --target em --profile bad_wifi --seed "$SEED_BASE" --count "$COUNT" --duration 8000 --out out/em-badwifi
      - name: Soak (em, hell)
        if: ${{ !cancelled() }}   # a failing sweep must not hide the others
        run: ./build/fnvcoop_simfuzz --target em --profile hell --seed "$SEED_BASE" --count "$COUNT" --duration 8000 --out out/em-hell
      - name: Soak (mini)
        if: ${{ !cancelled() }}   # a failing sweep must not hide the others
        run: ./build/fnvcoop_simfuzz --target mini --seed "$SEED_BASE" --count "$(( COUNT * 10 ))" --duration 8000 --out out/mini
      - name: Keep shrunk repros and traces of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: simfuzz-failures-${{ matrix.cxx }}
          path: out/
          if-no-files-found: ignore

