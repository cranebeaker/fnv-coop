name: Package
# Builds the co-op package for players on a hosted Windows machine and attaches it to a draft
# release. A maintainer starts it by hand, checks the draft, and publishes it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version, for example 0.3.0-alpha"
        required: true
        type: string
      ref:
        description: "Branch to package (the co-op on the upstream engine)"
        required: true
        default: coop-next
        type: string
permissions:
  contents: write
jobs:
  package:
    name: package
    runs-on: windows-latest
    timeout-minutes: 350
    env:
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install the Rust compilers
        run: |
          # The pinned compiler of rust-toolchain.toml, and stable with the 32-bit target for the
          # two 32-bit capture tools.
          rustup show active-toolchain
          if ($LASTEXITCODE) { rustup toolchain install; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
          rustup toolchain install stable --profile minimal --target i686-pc-windows-msvc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Fetch the build inputs that are not in the repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The pinned Steam library (Valve's steam_api64.dll); the package script checks its
          # hash and ships it only when it matches. Without it the package has no Steam invites.
          New-Item -ItemType Directory -Force third_party/steam | Out-Null
          gh release download build-deps -R $env:GITHUB_REPOSITORY -p steam_api64.dll -D third_party/steam --clobber
          if ($LASTEXITCODE) { Write-Warning 'No Steam library: the package will have no Steam invites.'; exit 0 }
      - name: Build and package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ./scripts/package-playtest.ps1 -Version $env:VERSION -Coop | Format-List
      - name: Attach the package to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          $name = "fnv-coop-$env:VERSION-windows-x64"
          $sha = git rev-parse HEAD
          gh release create "v$env:VERSION" "dist/$name.zip" "dist/$name.zip.sha256" --draft --prerelease --target $sha --title "FNV Co-Op $env:VERSION" --notes "Draft. The notes come before it is published."
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
