name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: check
    runs-on: windows-latest
    env:
      # CI builds once from a cache; incremental state and debug info only cost time.
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned Rust tools (rust-toolchain.toml)
        run: |
          rustup toolchain install
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # Reuse compiled dependencies between runs. Only pushes to main save the
      # cache, so pull requests restore main's build without filling the store.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: '. -> target'
          shared-key: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting, tests and lints
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --workspace
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # The texture crate's other arithmetic path: truncation done in software rather than by
      # the processor's rounding mode (the path for processors without one); same bytes.
      - name: Test d3dx-tex with software truncation
        run: |
          cargo test --locked -p d3dx-tex --features software-truncation
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked -p d3dx-tex --all-targets --features software-truncation -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # Its own workspace: what counts as a typed marker is defined there. `--check` stays out: the
      # ledger holds line numbers, which every merge moves.
      - name: Test the ledger
        run: |
          cargo test --locked --manifest-path scripts/ledger/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
