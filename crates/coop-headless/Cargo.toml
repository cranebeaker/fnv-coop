[package]
name = "coop-headless"
version = "0.1.0"
description = "Headless co-op scenario simulator: runs tools/coop-run scenarios in one process on a virtual clock, with the real session and live layers"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "coop_headless"

[[bin]]
name = "coop-sim"
path = "src/main.rs"

[dependencies]
coop-core = { path = "../coop-core", features = ["testkit"] }
coop-session = { path = "../coop-session" }
coop-voice = { path = "../coop-voice" }
# steam-mock: MockSteam and SteamBackend for the checklist's Steam check, no DLL loader.
coop-net = { path = "../coop-net", features = ["steam-mock"] }
nv-launcher = { path = "../nv-launcher" }
coop-policy = { path = "../coop-policy" }
world = { path = "../world" }
esm = { path = "../esm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
script = { path = "../script" }

[dev-dependencies]
testdata = { path = "../testdata" }
