[package]
name = "engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "FalloutNV.exe translated function by function into Rust, on a model of the game's memory (ADR-0006): the engine crates assembled, every function registered"

# The engine is split into crates so a compile fits the machine
# (docs/ENGINE_CRATE.md, "The engine crates"); this one depends on all of them,
# re-exports them as `engine::...` and registers every translated function.
[dependencies]
engine-core = { path = "../engine-core" }
engine-gamebryo = { path = "../engine-gamebryo" }
engine-bs = { path = "../engine-bs" }
engine-havok = { path = "../engine-havok" }
engine-speedtree = { path = "../engine-speedtree" }
engine-fallout-facegen = { path = "../engine-fallout-facegen" }
engine-fallout-script = { path = "../engine-fallout-script" }
engine-fallout-pathfinding = { path = "../engine-fallout-pathfinding" }
engine-fallout-env = { path = "../engine-fallout-env" }
engine-fallout-cell = { path = "../engine-fallout-cell" }
engine-fallout-forms = { path = "../engine-fallout-forms" }
engine-fallout-magic = { path = "../engine-fallout-magic" }
engine-fallout-interface = { path = "../engine-fallout-interface" }
engine-fallout-ai = { path = "../engine-fallout-ai" }
engine-fallout-unplaced-a = { path = "../engine-fallout-unplaced-a" }
engine-fallout-unplaced-b = { path = "../engine-fallout-unplaced-b" }
engine-fallout-misc = { path = "../engine-fallout-misc" }
# The platform layer (the window, Direct3D 9, DirectInput, DirectSound, files, ...): its own
# crate, so a change there rebuilds no part crate; registered here like the parts.
engine-platform = { path = "../engine-platform" }

[dev-dependencies]
# The opt-in real-script run (`tests/real_scda.rs`) reads the player's
# FalloutNV.esm.
esm = { path = "../esm" }
