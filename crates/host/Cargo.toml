[package]
name = "host"
version = "0.1.0"
description = "Starts the game's own translated code (the engine crate) on the player's FalloutNV.exe and runs its frames"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
engine = { path = "../engine" }
# The platform layer (the window, Direct3D 9, DirectInput, DirectSound, files): the host drives
# its input, sound output and adapter table.
engine-platform = { path = "../engine-platform" }
# The play loop's patched functions, registered over the engine's own at start-up
# (crates/play-patch; empty on main).
play-patch = { path = "../play-patch" }
# The load order the game's forms are read from (`player_move`).
esm = { path = "../esm" }
