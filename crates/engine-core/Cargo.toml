[package]
name = "engine-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The core of the engine crates: the game's memory model, Engine, the exe mapping, the static tables and the CRT and platform units (ADR-0006)"

[features]
# Test support that other engine crates' unit tests use (the form-constructor
# checker `units::crt::ctor_test`); they enable it as a dev-dependency.
test-support = []

[dependencies]
# The platform's Bink layer (units/platform/bink.rs) decodes with the
# repository's own Bink 1 decoder.
bink = { path = "../bink" }
mp3 = { path = "../mp3" }
vorbis = { path = "../vorbis" }

# The Direct3D 9 layer forwarded to the real d3d9.dll with NV_D3D9=real (ADR-0008,
# units/platform/d3d9real.rs): the real window, device and resources.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D9", "Win32_Graphics_Gdi", "Foundation_Numerics", "Win32_System_LibraryLoader", "Win32_UI_Input", "Win32_UI_WindowsAndMessaging"] }
