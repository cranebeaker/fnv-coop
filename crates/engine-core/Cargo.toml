[package]
name = "engine-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The core of the engine crates: the game's memory model, Engine, the exe mapping, the static tables, the CRT units and the core of the platform layer (ADR-0006)"

[features]
# Test support that other engine crates' unit tests use (the form-constructor
# checker `units::crt::ctor_test`, and for `engine-platform` the addresses and helpers of
# `units::crt::stdio::test_support` and `units::platform::test_support`); they enable it as a
# dev-dependency.
test-support = []

# Win32_System_Memory: the guest memory's 4 GB host reservation (mem.rs, VirtualAlloc and
# VirtualFree). The platform layer's Windows APIs are the `engine-platform` crate's.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Memory"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(nv_chained_unwind_asm)"] }
