[package]
name = "nv-viewer"
version = "0.1.0"
description = "Runs Fallout: New Vegas through the engine port: the game's own translated code on the player's FalloutNV.exe"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# The game's own translated code (crates/engine), started on the player's FalloutNV.exe.
host = { path = "../crates/host" }
# Co-op (docs/coop/PLAN.md M3): the session on the engine, its network and the load order the
# handshake and the replicated globals come from.
coop-core = { path = "../crates/coop-core" }
coop-net = { path = "../crates/coop-net" }
# The quest rules: which quests each player runs for themself.
coop-policy = { path = "../crates/coop-policy" }
coop-engine = { path = "../crates/coop-engine" }
coop-engine-session = { path = "../crates/coop-engine-session" }
engine-core = { path = "../crates/engine-core" }
esm = { path = "../crates/esm" }
