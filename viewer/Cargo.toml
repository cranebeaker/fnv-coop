[package]
name = "nv-viewer"
version = "0.1.0"
description = "Walk around a Fallout: New Vegas cell in real time (Bevy)"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

# Its own workspace, so the rest of the project still builds without
# downloading Bevy.
[workspace]

[dependencies]
# Pinned: Bevy's API changes between releases.
bevy = { version = "0.16", features = ["wayland"] }
# Bevy's own wgpu (the same version, no features of its own): the window's
# surface asked which present modes it takes (`present`).
wgpu = { version = "24", default-features = false }
cellview = { path = "../crates/cellview" }
physics = { path = "../crates/physics" }
world = { path = "../crates/world" }
# The game's own translated code, started on the player's FalloutNV.exe.
host = { path = "../crates/host" }
esm = { path = "../crates/esm" }
nif = { path = "../crates/nif" }
preview = { path = "../crates/preview" }
assets = { path = "../crates/assets" }
ui = { path = "../crates/ui" }
bink = { path = "../crates/bink" }
speedtree = { path = "../crates/speedtree" }
# Decodes the game's .ogg sounds (already in the build through Bevy's audio,
# whose own .ogg playback crashed the viewer in Dead Money's Villa).
lewton = "0.10"

[dev-dependencies]
testdata = { path = "../crates/testdata" }

# Bevy is slow unoptimized; optimize dependencies even in debug builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The play-build loop's viewers (`cargo build --profile play`, exe in target/play/): the engine
# crates and host at opt-level 1 (their time is almost all code generation: engine-fallout (one crate then) 370
# of 448 s, engine-havok 290 of 321 s at opt-level 3, 2026-10-23), dependencies as in release.
# Packaging the play copy stays on `--release`.
[profile.play]
inherits = "release"
incremental = true
debug = 0

[profile.play.package.engine-core]
opt-level = 1
# The release profile's single code unit for engine-core (below) would be inherited; the quick
# profiles keep incremental's default.
codegen-units = 256

[profile.play.package.engine-gamebryo]
opt-level = 1

[profile.play.package.engine-bs]
opt-level = 1

[profile.play.package.engine-havok]
opt-level = 1

[profile.play.package.engine-speedtree]
opt-level = 1

[profile.play.package.engine-fallout-facegen]
opt-level = 1

[profile.play.package.engine-fallout-script]
opt-level = 1

[profile.play.package.engine-fallout-pathfinding]
opt-level = 1

[profile.play.package.engine-fallout-env]
opt-level = 1

[profile.play.package.engine-fallout-cell]
opt-level = 1

[profile.play.package.engine-fallout-forms]
opt-level = 1
# More modules (412) than the default 256 code-generation units: one unit each, so a
# one-file fix re-generates one unit.
codegen-units = 512

[profile.play.package.engine-fallout-magic]
opt-level = 1

[profile.play.package.engine-fallout-interface]
opt-level = 1

[profile.play.package.engine-fallout-ai]
opt-level = 1

[profile.play.package.engine-fallout-unplaced-a]
opt-level = 1

[profile.play.package.engine-fallout-unplaced-b]
opt-level = 1

[profile.play.package.engine-fallout-misc]
opt-level = 1

[profile.play.package.engine]
opt-level = 1

[profile.play.package.host]
opt-level = 1

# The play loop's patches: rebuilt after each fix, so the quickest code generation.
[profile.play.package.play-patch]
opt-level = 1

# Long play-build runs (a full data load): `--profile play-fast`, exe in target/play-fast/; the
# engine crates and host at opt-level 3. Quick stop-fix loops stay on `--profile play`.
[profile.play-fast]
inherits = "play"

[profile.play-fast.package.engine-core]
opt-level = 3

[profile.play-fast.package.engine-gamebryo]
opt-level = 3

[profile.play-fast.package.engine-bs]
opt-level = 3

[profile.play-fast.package.engine-havok]
opt-level = 3

[profile.play-fast.package.engine-speedtree]
opt-level = 3

# The engine-fallout-* crates (one crate until 2026-11-03) at opt-level 1 (2026-10-27): they are
# most of the build time and little of the run time (dispatch is in engine-core); fixes made
# during a play loop go to crates/play-patch.
[profile.play-fast.package.engine-fallout-facegen]
opt-level = 1

[profile.play-fast.package.engine-fallout-script]
opt-level = 1

[profile.play-fast.package.engine-fallout-pathfinding]
opt-level = 1

[profile.play-fast.package.engine-fallout-env]
opt-level = 1

[profile.play-fast.package.engine-fallout-cell]
opt-level = 1

[profile.play-fast.package.engine-fallout-forms]
opt-level = 1
# More modules (412) than the default 256 code-generation units: one unit each, so a
# one-file fix re-generates one unit.
codegen-units = 512

[profile.play-fast.package.engine-fallout-magic]
opt-level = 1

[profile.play-fast.package.engine-fallout-interface]
opt-level = 1

[profile.play-fast.package.engine-fallout-ai]
opt-level = 1

[profile.play-fast.package.engine-fallout-unplaced-a]
opt-level = 1

[profile.play-fast.package.engine-fallout-unplaced-b]
opt-level = 1

[profile.play-fast.package.engine-fallout-misc]
opt-level = 1

[profile.play-fast.package.engine]
opt-level = 3

[profile.play-fast.package.host]
opt-level = 3

# A fully optimised play build (`--profile play-opt`, exe in target/play-opt/; 2026-10-28): every
# crate at opt-level 3 as in release, without the play profiles' incremental builds (their 256
# code-generation units a crate cost run time), and engine-core, where every call and memory
# access goes through, as one code-generation unit (a small crate: a minute to build).
[profile.play-opt]
inherits = "release"
debug = 0
incremental = false

[profile.play-opt.package.engine-core]
codegen-units = 1

# The playtest packages (`scripts/package-playtest.ps1`) build `--release`: engine-core as one
# code-generation unit there too, as in play-opt, the build the frame rates are measured on
# (2026-10-30).
[profile.release.package.engine-core]
codegen-units = 1
