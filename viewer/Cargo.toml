[package]
name = "nv-viewer"
version = "0.1.0"
description = "Runs Fallout: New Vegas through the engine port: the game's own translated code on the player's FalloutNV.exe"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# The game's own translated code (crates/engine), started on the player's FalloutNV.exe.
host = { path = "../crates/host" }
# Co-op (docs/coop/PLAN.md M3): the session on the engine, its network and the load order the
# handshake and the replicated globals come from.
coop-core = { path = "../crates/coop-core" }
coop-net = { path = "../crates/coop-net" }
# The quest rules: which quests each player runs for themself.
coop-policy = { path = "../crates/coop-policy" }
coop-engine = { path = "../crates/coop-engine" }
coop-engine-session = { path = "../crates/coop-engine-session" }
engine-core = { path = "../crates/engine-core" }
engine-platform = { path = "../crates/engine-platform" }
esm = { path = "../crates/esm" }
# voice: co-op voice chat's microphone, codec (Opus) and speakers (docs/coop/SPECS.md S32).
coop-voice = { path = "../crates/coop-voice", optional = true }

[features]
# Voice chat and Steam invites are in the package's build; `--no-default-features` builds the game
# program without them (no cpal, no libopus, no Steam library loader).
default = ["voice", "steam"]
# voice: cpal for the microphone and the speakers, libopus (built from source with CMake).
voice = ["dep:coop-voice", "coop-voice/capture", "coop-voice/opus"]
# steam: loads Valve's steam_api64.dll at run time when a session asks for Steam (S33).
steam = ["coop-net/steam"]
