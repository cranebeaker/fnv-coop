[workspace]
resolver = "2"
# The Bevy viewer is its own workspace (see viewer/Cargo.toml).
exclude = ["viewer"]
members = ["crates/engine", "crates/engine-core", "crates/engine-gamebryo", "crates/engine-bs", "crates/engine-havok", "crates/engine-speedtree", "crates/engine-fallout", "crates/host", "crates/play-patch", "crates/esm", "crates/bsa", "crates/nif", "crates/dds", "crates/assets", "crates/world", "crates/preview", "crates/cellview", "crates/testdata", "crates/shaders", "crates/nvinspect", "crates/physics", "crates/script", "crates/scriptgen", "crates/mp3", "crates/vorbis", "crates/bink", "crates/ui", "crates/speedtree", "crates/fos", "crates/coop-*", "crates/nv-launcher"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.75"
